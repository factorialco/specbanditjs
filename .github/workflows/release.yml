name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    name: "Release"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUBLISH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Bump version
        id: bump
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update package-lock.json
        run: npm install --package-lock-only

      # The VERSION constant cannot import package.json (tsconfig rootDir is
      # src), so the release has to keep the two in step. Without this the
      # constant silently rots and `--version` reports a version nobody shipped.
      - name: Sync the VERSION constant
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          node -e "
            const fs = require('fs')
            const path = 'src/configuration.ts'
            const before = fs.readFileSync(path, 'utf8')
            const after = before.replace(/^export const VERSION = '.*'$/m, \"export const VERSION = '\" + process.env.VERSION + \"'\")
            if (after === before) { console.error('VERSION constant not found in ' + path); process.exit(1) }
            fs.writeFileSync(path, after)
          "
        env:
          VERSION: ${{ steps.bump.outputs.version }}

      - name: Commit and push version bump
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/configuration.ts
          git commit -m "Release v${VERSION}"
          git push origin main

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes

      - name: Summary
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          {
            echo "## Released v${VERSION}"
            echo ""
            echo "- [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/v${VERSION})"
            echo "- npm publish will be handled by the publish workflow on tag push"
          } >> "$GITHUB_STEP_SUMMARY"
